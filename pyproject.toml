[project]
name = "aide"
version = "0.2.0"
description = "Personal AI assistant for schedule, reminders and mail, over chat."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "caldav>=3.5.0",
    "cheroot>=10",
    "claude-agent-sdk>=0.2.174",
    "cryptography>=50.0.2",
    "fastapi>=0.143.5",
    "gtfs-realtime-bindings>=1.0",
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "niquests>=3.21.2",
    "playwright>=1.64.1",  # browser errands; its Chromium: uv run playwright install chromium
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
    "websockets>=15.0",  # uvicorn serves the browser live view (/v1/browser/live) with it
    "wsgidav>=4.3",
    "yt-dlp>=2026.10.26",  # YouTube videos (videos.py); YouTube breaks old ones: uv lock --upgrade-package yt-dlp
]

[project.optional-dependencies]
# Lecture transcription on the GPU (study.py, whisper.py). Only the server box installs it: uv sync --extra whisper
whisper = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
aide = "aide.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
