[project]
name = "aide"
version = "0.2.0"
description = "Personal AI assistant for schedule, reminders and mail, over chat."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "caldav>=3.5.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.5",
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "niquests>=3.21.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aide = "aide.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
