name: Aide
options:
  bundleIdPrefix: com.filippocappa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set DEVELOPMENT_TEAM to the paid team's ID in Xcode (Signing & Capabilities) before installing on the phone.
    # The Simulator doesn't need it.
    CODE_SIGN_STYLE: Automatic
targets:
  Aide:
    type: application
    platform: iOS
    sources:
      - Aide
    info:
      path: Aide/Info.plist
      properties:
        CFBundleDisplayName: Aide
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: Aide mirrors your reminders into a list in Apple Reminders so your phone can notify you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filippocappa.aide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  AideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AideTests
    dependencies:
      - target: Aide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filippocappa.aide.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aide:
    build:
      targets:
        Aide: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AideTests
