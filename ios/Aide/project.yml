name: Aide
options:
  bundleIdPrefix: com.filippocappa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The team ID comes from Config/Signing.local.xcconfig (see the .example file), not from here.
    CODE_SIGN_STYLE: Automatic
packages:
  # LaTeX formulas in the notes (Views/NotesView.swift, MathFormula).
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  Aide:
    type: application
    platform: iOS
    sources:
      - Aide
      - Shared
      - ScreenTime
    dependencies:
      - target: AideWidgets
      - target: AideShare
      - target: LockMonitor
      - target: LockShield
      - package: SwiftMath
    info:
      path: Aide/Info.plist
      properties:
        CFBundleDisplayName: Aide
        # The keychain items the widgets read too (Support/Keychain.swift), and the App Group they share.
        AideKeychainService: $(AIDE_BUNDLE_ID)
        AideAppGroup: group.$(AIDE_BUNDLE_ID)
        # Widgets and Live Activities open the app with aide:// links (PushRoute).
        CFBundleURLTypes:
          - CFBundleURLName: $(AIDE_BUNDLE_ID)
            CFBundleURLSchemes: [aide]
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Aide listens when you tap the microphone, so you can talk instead of type.
        NSSpeechRecognitionUsageDescription: Aide turns what you say into text to send to your assistant.
        NSRemindersFullAccessUsageDescription: Aide mirrors your reminders into a list in Apple Reminders so your phone can notify you.
        NSCameraUsageDescription: Aide uses the camera when you take a photo to send, like a meal to log.
        NSLocationWhenInUseUsageDescription: Aide sends where you are to your server, so a tram alert knows how long the walk to the stop is.
        NSLocationAlwaysAndWhenInUseUsageDescription: With Always, tram alerts know the walk to the stop with the app closed. Aide sends your location only when you move about 500 m or an alert is about to fire.
        NSHealthShareUsageDescription: Aide reads your sleep, heart rate, HRV, steps and workouts to write your wake-up briefing and tick off workout habits.
        NSHealthUpdateUsageDescription: Aide writes the meals and drinks you log through it (calories, protein, carbs, fat, water, caffeine), and a limit habit's counts to Inhaler Usage, so you don't have to log them twice.
        # Silent pushes wake the app to sync reminders (docs/API.md, Push).
        UIBackgroundModes:
          - remote-notification
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID)  # Config/Base.xcconfig; your own in Signing.local.xcconfig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  # Widgets and the Live Activities' Lock Screen and Dynamic Island (docs/API.md, "Widgets", "Live Activities").
  # They read the server themselves, with the URL and token the app shares through the App Group's keychain.
  AideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AideWidgets
      - Shared
      - Aide/Models/Models.swift
      - Aide/Networking/APIClient.swift
      - Aide/Support/AppSettings.swift
      - Aide/Support/Keychain.swift
      - Aide/Support/Theme.swift
      - Aide/Support/Figure.swift
      - ScreenTime/ScreenLock.swift
    info:
      path: AideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aide
        AideKeychainService: $(AIDE_BUNDLE_ID)
        AideAppGroup: group.$(AIDE_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: AideWidgets/AideWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # The share sheet: a YouTube link from the YouTube app or Safari goes to Aide (docs/API.md, "Videos"). It reads the
  # server's URL and token from the App Group's keychain, as the widgets do.
  AideShare:
    type: app-extension
    platform: iOS
    sources:
      - AideShare
      - Aide/Models/Models.swift
      - Aide/Networking/APIClient.swift
      - Aide/Support/AppSettings.swift
      - Aide/Support/Keychain.swift
      - Aide/Support/Theme.swift
      - Aide/Support/Figure.swift
      - ScreenTime/ScreenLock.swift
    info:
      path: AideShare/Info.plist
      properties:
        CFBundleDisplayName: Aide
        AideKeychainService: $(AIDE_BUNDLE_ID)
        AideAppGroup: group.$(AIDE_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID).share
        CODE_SIGN_ENTITLEMENTS: AideShare/AideShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # Screen Time locks (docs/API.md, "Screen Time"): the monitor shields and opens the apps on each lock's schedule,
  # the shield is what a locked app shows. Both read the locks the app keeps in the App Group (ScreenTime/).
  LockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - LockMonitor
      - ScreenTime
    info:
      path: LockMonitor/Info.plist
      properties:
        CFBundleDisplayName: Aide
        AideAppGroup: group.$(AIDE_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID).lockmonitor
        CODE_SIGN_ENTITLEMENTS: LockMonitor/LockMonitor.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LockShield:
    type: app-extension
    platform: iOS
    sources:
      - LockShield
      - ScreenTime
    info:
      path: LockShield/Info.plist
      properties:
        CFBundleDisplayName: Aide
        AideAppGroup: group.$(AIDE_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID).lockshield
        CODE_SIGN_ENTITLEMENTS: LockShield/LockShield.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # The Mac app: the same views as the phone, in a sidebar window. What only a phone has (Apple Health, Live
  # Activities, Screen Time, location, the meal camera, Apple Reminders sync) stays on the phone: Mac/MacServices.swift
  # stands in for those services, and Mac/iOSCompat.swift lets the shared views' UIKit and iOS-only modifiers build.
  AideMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Aide
        excludes:
          - AideApp.swift
          - Info.plist
          - "*.entitlements"
          - Health/HealthService.swift
          - Health/WakeUpIntent.swift
          - Support/LiveActivities.swift
          - Support/LocationService.swift
          - Support/ScreenTimeService.swift
          - Support/TouchTracker.swift
          - Sync/ReminderSyncService.swift
          - Views/MealCameraView.swift
          - Views/ScreenTimeView.swift
      - Mac
      - Shared/LineBadge.swift
      - Shared/MealIntents.swift
      - ScreenTime/ScreenLock.swift
    dependencies:
      - package: SwiftMath
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Aide
        AideKeychainService: $(AIDE_BUNDLE_ID).mac
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: $(AIDE_BUNDLE_ID).mac
            CFBundleURLSchemes: [aide]
        NSMicrophoneUsageDescription: Aide listens when you click the microphone, so you can talk instead of type.
        NSSpeechRecognitionUsageDescription: Aide turns what you say into text to send to your assistant.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID).mac
        PRODUCT_NAME: Aide
        CODE_SIGN_ENTITLEMENTS: $(AIDE_MAC_ENTITLEMENTS)  # Config/Base.xcconfig; push in Signing.local.xcconfig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # Aide/AppIcon.icon, shared with the phone
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
  AideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AideTests
    dependencies:
      - target: Aide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Aide:
    build:
      targets:
        Aide: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AideTests
  AideMac:
    build:
      targets:
        AideMac: all
    run:
      config: Debug
